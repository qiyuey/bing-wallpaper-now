[package]
name = "bing-wallpaper-now"
version = "1.6.1"
description = "A Bing Wallpaper App"
authors = ["qiyuey"]
edition = "2024"
rust-version = "1.90"


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "bing_wallpaper_now_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }

[dependencies]
tauri = { version = "2.12.6", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2.7.3"
tauri-plugin-store = "2.5.1"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-log = "2.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
reqwest = { version = "0.13.5", features = ["json", "stream", "rustls"], default-features = false }
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "fs", "time", "sync", "io-util", "macros", "test-util"] }
chrono = { version = "0.4.45", features = ["serde"] }
anyhow = "1.0.104"
dirs = "7.0.0"
log = "0.4.35"
tauri-plugin-single-instance = "2.5.5"
# JPEG wallpapers and PNG tray icons; avoid unused codecs and Rayon.
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
indexmap = { version = "2.14.2", features = ["serde"] }
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"
semver = "1.0.28"
sys-locale = "0.3.2"

[target.'cfg(target_os = "macos")'.dependencies]
mac-usernotifications = "0.3.1"
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", features = ["NSString", "NSDictionary", "NSArray", "NSURL", "NSError", "NSNotification"] }
objc2-app-kit = { version = "0.3.2", features = ["NSWorkspace", "NSScreen", "NSApplication", "NSResponder", "NSRunningApplication"] }

[target.'cfg(windows)'.dependencies]
notify-rust = "4.19.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }
